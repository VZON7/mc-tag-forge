<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 D · 重排 + 复刻旁带原图缩略图</title>
<style>
:root{
  --void:#0a010c; --tip-bg:#100110; --tip-edge:#24015b; --panel:#17081f;
  --panel-hi:#1f0d2a; --line:#2c1638; --ink:#e8dff0; --ink-dim:#9a8fa8;
  --ink-faint:#6b5f7a; --ember:#f37c52; --deep:#2f5b8b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,"Noto Sans SC",sans-serif;padding:20px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:15px;color:var(--ink-dim);font-weight:700;margin:0 0 4px}
.tag{display:inline-block;font-size:11px;color:var(--ember);border:1px solid var(--ember);border-radius:999px;padding:2px 9px;margin-bottom:14px}
.note{font-size:12px;color:var(--ink-faint);line-height:1.6;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
label.f{display:flex;align-items:center;font-size:11px;color:var(--ink-dim);margin-bottom:6px}
.why{font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-left:auto}
.fakeshot{background:var(--tip-bg);border:2px solid var(--tip-edge);height:70px;display:flex;align-items:center;justify-content:center;
  font-size:20px;letter-spacing:.05em}
.fakeshot span:nth-child(1){color:#f37c52}.fakeshot span:nth-child(2){color:#b76b70}
.fakeshot span:nth-child(3){color:#7d6296}.fakeshot span:nth-child(4){color:#2f5b8b}
.toprow{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--ink-faint)}
.toprow button{background:var(--panel-hi);border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:4px 9px;cursor:pointer}
input[type=text]{width:100%;background:var(--void);color:var(--ink);border:1px solid var(--line);padding:8px 9px;font-size:14px}
input:focus{outline:none;border-color:var(--ember)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--void);border:1px solid var(--line);padding:5px 10px;font-size:12px;cursor:pointer;border-radius:3px}
.chip:hover,.chip.on{border-color:var(--ember);color:var(--ember)}
.fitrow{display:flex;align-items:center;gap:10px;background:var(--void);border:1px solid var(--line);padding:6px 9px;margin-top:6px;font-size:12px}
.fitrow .bar{display:flex;flex:1;height:10px}
.fitrow .bar div{flex:1}
.fitrow button{background:var(--panel-hi);border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:3px 8px;cursor:pointer}
.reprowrap{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.thumb{background:var(--tip-bg);border:1px solid var(--tip-edge);height:40px;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.02em;overflow:hidden}
.thumb span:nth-child(1){color:#f37c52}.thumb span:nth-child(2){color:#b76b70}.thumb span:nth-child(3){color:#7d6296}.thumb span:nth-child(4){color:#2f5b8b}
.thumblabel{font-size:9px;color:var(--ink-faint);text-align:center;margin-top:2px}
.repro{background:var(--tip-bg);border:2px solid var(--tip-edge);padding:12px;font-size:20px;min-height:30px;letter-spacing:.05em}
.pickerfake{display:flex;gap:10px;margin-top:8px}
.sv{width:100px;height:70px;background:linear-gradient(to right,#fff,#f37c52);position:relative}
.sv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000,transparent)}
.hue{width:16px;height:70px;background:linear-gradient(to bottom,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
textarea{width:100%;background:var(--void);color:var(--ink);border:1px solid var(--line);padding:8px 9px;font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:44px}
.advtoggle{font-size:11px;color:var(--ember);cursor:pointer;user-select:none}
.hexlist{display:none;margin-top:8px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-faint);line-height:1.9}
.hexlist span{border-bottom:2px solid;padding:1px 3px}
.hexlist.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>方案 D · 重排 + 复刻旁带原图缩略图</h1>
  <span class="tag">比方案 B 轻，不用吸顶结构</span>
  <div class="note">
    跟方案 A 一样重排顺序（文字提前），但"复刻效果"那一格左边永远贴一张原图的小缩略图——不用整块吸顶，只是在真正需要对比的那一刻，把原图的样子也放在旁边，不用再往上滚。工程量比方案 B 小（不用处理吸顶层叠、不用担心窄屏怎么摆两栏），但灵活性也差一点——缩略图很小，看细节还是得滚上去看大图。
  </div>

  <div class="panel">
    <label class="f">原图</label>
    <div class="toprow">
      <button>1×</button><button class="on">2×</button><button>4×</button>
      <span style="flex:1"></span>
      <button id="eyedropBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><path d="M19.5 4.5c1.5 1.5 1.5 4 0 5.5l-9 9-4 1 1-4 9-9c1.5-1.5 4-1.5 5.5 0z"/><circle cx="6.2" cy="17.8" r="1.4" fill="currentColor" stroke="none"/></svg>取色笔
      </button>
    </div>
    <div class="fakeshot"><span>T</span><span>a</span><span>k</span><span>o</span></div>
  </div>

  <div class="panel">
    <label class="f">2/3/4 色推荐<span class="why">取到 17 个色阶</span></label>
    <div class="fitrow"><b style="width:34px">2 色</b><span class="bar"><div style="background:#f37c52"></div><div style="background:#2f5b8b"></div></span><span style="font-size:11px;color:var(--ink-faint)">97.6%</span><button>选这个</button></div>
  </div>

  <div class="panel" style="border-color:var(--ember)">
    <label class="f">文字内容 + 花体</label>
    <input type="text" id="txt" value="Takodachi" placeholder="打上实际文字">
    <div class="chips">
      <div class="chip on" data-c="0">原样</div><div class="chip" data-c="1">粗体</div><div class="chip" data-c="2">斜体</div>
    </div>
  </div>

  <div class="panel" style="border-color:var(--ember)">
    <label class="f">复刻效果<span class="why">旁边带一张原图缩略图，不用滚上去</span></label>
    <div class="reprowrap">
      <div>
        <div class="thumb"><span>T</span><span>a</span><span>k</span><span>o</span></div>
        <div class="thumblabel">原图</div>
      </div>
      <div class="repro" id="repro"></div>
    </div>
  </div>

  <div class="panel">
    <label class="f">我的配色调色盘<span class="why">微调，看到效果之后再做</span></label>
    <div class="pickerfake"><div class="sv"></div><div class="hue"></div></div>
  </div>

  <div class="panel">
    <label class="f">代码区</label>
    <textarea readonly>{#f37c52>}Tak{#2f5b8b<}odachi</textarea>
    <div class="chips" style="margin-top:8px">
      <div class="chip">复制完整代码</div><div class="chip">重新生成</div><div class="chip">套用配色去创作</div>
    </div>
  </div>

  <div class="panel">
    <span class="advtoggle" id="advT">▸ 详细数据（逐字实测色值）</span>
    <div class="hexlist" id="hexlist">逐字实测：<span style="border-color:#f37c52">F37C52</span> <span style="border-color:#e57857">E57857</span> <span style="border-color:#2f5b8b">2F5B8B</span></div>
  </div>
</div>
<script>
const txt=document.getElementById('txt'), repro=document.getElementById('repro');
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function hex2rgb(h){h=h.slice(1);return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
function paint(){
  const s=txt.value||' ', a=hex2rgb('#f37c52'), b=hex2rgb('#2f5b8b'), n=s.length;
  repro.innerHTML=[...s].map((ch,i)=>{
    const t=n>1?i/(n-1):0, col=rgb2hex([lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]);
    return `<span style="color:${col}">${ch===' '?'&nbsp;':ch}</span>`;
  }).join('');
}
txt.addEventListener('input',paint); paint();
document.querySelectorAll('.chip[data-c]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip[data-c]').forEach(x=>x.classList.remove('on')); c.classList.add('on');
});
document.getElementById('advT').onclick=function(){
  const box=document.getElementById('hexlist'), on=box.classList.toggle('show');
  this.textContent=(on?'▾':'▸')+' 详细数据（逐字实测色值）';
};
</script>
</body>
</html>
