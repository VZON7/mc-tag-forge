<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 B · 并排对比</title>
<style>
:root{
  --void:#0a010c; --tip-bg:#100110; --tip-edge:#24015b; --panel:#17081f;
  --panel-hi:#1f0d2a; --line:#2c1638; --ink:#e8dff0; --ink-dim:#9a8fa8;
  --ink-faint:#6b5f7a; --ember:#f37c52; --deep:#2f5b8b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,"Noto Sans SC",sans-serif;padding:20px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:15px;color:var(--ink-dim);font-weight:700;margin:0 0 4px}
.tag{display:inline-block;font-size:11px;color:var(--ember);border:1px solid var(--ember);border-radius:999px;padding:2px 9px;margin-bottom:14px}
.note{font-size:12px;color:var(--ink-faint);line-height:1.6;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
label.f{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;top:12px;background:var(--void);
  padding:10px 0;z-index:2;margin-bottom:14px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
.fakeshot{background:var(--tip-bg);border:2px solid var(--tip-edge);height:70px;display:flex;align-items:center;justify-content:center;
  font-size:18px;letter-spacing:.05em}
.fakeshot span:nth-child(1){color:#f37c52}.fakeshot span:nth-child(2){color:#b76b70}
.fakeshot span:nth-child(3){color:#7d6296}.fakeshot span:nth-child(4){color:#2f5b8b}
.repro{background:var(--tip-bg);border:2px solid var(--tip-edge);height:70px;display:flex;align-items:center;justify-content:center;
  font-size:22px;letter-spacing:.05em}
.sticky-label{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
input[type=text]{width:100%;background:var(--void);color:var(--ink);border:1px solid var(--line);padding:8px 9px;font-size:14px}
input:focus{outline:none;border-color:var(--ember)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--void);border:1px solid var(--line);padding:5px 10px;font-size:12px;cursor:pointer;border-radius:3px}
.chip:hover,.chip.on{border-color:var(--ember);color:var(--ember)}
.fitrow{display:flex;align-items:center;gap:10px;background:var(--void);border:1px solid var(--line);padding:6px 9px;margin-top:6px;font-size:12px}
.fitrow .bar{display:flex;flex:1;height:10px}
.fitrow .bar div{flex:1}
.fitrow button{background:var(--panel-hi);border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:3px 8px;cursor:pointer}
.scrollhint{font-size:11px;color:var(--ink-faint);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>方案 B · 并排对比（原图 / 复刻永远同屏）</h1>
  <span class="tag">改动较大：加一条吸顶对比区</span>
  <div class="note">思路：原图和复刻效果各占一半宽度，钉在顶部（往下滚动改配色/改文字，这两个不会滚走）——不管你在下面调什么，随时能拿两边对着看，不用来回滚动。下面滚动区放"文字内容""花体""配色微调"这些操作面板。</div>

  <div class="compare">
    <div>
      <div class="sticky-label">原图</div>
      <div class="fakeshot"><span>T</span><span>a</span><span>k</span><span>o</span></div>
    </div>
    <div>
      <div class="sticky-label">复刻效果</div>
      <div class="repro" id="repro"></div>
    </div>
  </div>

  <div class="panel">
    <label class="f">文字内容</label>
    <input type="text" id="txt" value="Takodachi" placeholder="打上实际文字">
    <div class="chips">
      <div class="chip on">原样</div><div class="chip">粗体</div><div class="chip">斜体</div>
    </div>
  </div>

  <div class="panel">
    <label class="f">我的配色</label>
    <div class="fitrow"><b style="width:36px">2 色</b><span class="bar"><div style="background:#f37c52"></div><div style="background:#2f5b8b"></div></span><button>选这个</button></div>
    <div class="fitrow"><b style="width:36px">3 色</b><span class="bar"><div style="background:#f37c52"></div><div style="background:#7d6296"></div><div style="background:#2f5b8b"></div></span><button>选这个</button></div>
  </div>

  <div class="scrollhint">↑ 往上滚动试试——对比区一直钉在顶部 ↑</div>
</div>
<script>
const txt=document.getElementById('txt'), repro=document.getElementById('repro');
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function hex2rgb(h){h=h.slice(1);return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
function paint(){
  const s=txt.value||' ', a=hex2rgb('#f37c52'), b=hex2rgb('#2f5b8b'), n=s.length;
  repro.innerHTML=[...s].map((ch,i)=>{
    const t=n>1?i/(n-1):0, col=rgb2hex([lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]);
    return `<span style="color:${col}">${ch===' '?'&nbsp;':ch}</span>`;
  }).join('');
}
txt.addEventListener('input',paint); paint();
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
});
</script>
</body>
</html>
